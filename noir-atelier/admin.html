<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR Atelier • CRM & Client Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Zero-Flicker Theme Initializer -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('noir_crm_theme');
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- PulseCore Smart Engine Resolver -->
  <script>
    window.__ENGINE_PREFIX = (location.pathname.includes('/salons/') || location.pathname.includes('\\salons\\')) ? '../../engine/salon' : '../engine/salon';
    document.write('<link rel="stylesheet" href="' + window.__ENGINE_PREFIX + '/salon-engine.css?v=20261106_core_v10">');
  </script>
  
  <!-- Tenant Specific Data & Configuration -->
  <script src="js/salon.config.js?v=20261106_core_v10"></script>
  <script src="js/data.js?v=20261106_core_v10"></script>
</head>
<body class="admin-body">
  <!-- PulseCore Mount Point: Single Point of Ingestion -->
  <div id="salonAppRoot"></div>

  <!-- PulseCore Salon Engine Bundle Injection -->
  <script>
    const coreScript = document.createElement('script');
    coreScript.src = window.__ENGINE_PREFIX + '/salon-engine.js?v=20261106_core_v10';
    coreScript.async = false;
    document.body.appendChild(coreScript);
  </script>
</body>
</html>
