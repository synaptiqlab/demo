<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@900&family=Rye&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #08090C; color: #fff; overflow-x: hidden; text-align: center; }
.hero-titles-wrap {
  width: calc(100vw - 12px);
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hero-gothic-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 900;
  white-space: nowrap;
  text-transform: uppercase;
  margin: 0 0 4px;
  line-height: 1.08;
  font-size: 13.8vw; letter-spacing: 0.04em;
}
.hero-gothic-sub {
  font-family: 'Rye', cursive, serif;
  font-weight: 400;
  white-space: nowrap;
  text-transform: uppercase;
  color: #FF2B44;
  margin: 0 0 6px;
  line-height: 1.08;
  font-size: 6.8vw; letter-spacing: 0.08em;
}
</style>
</head>
<body>
<div class="hero-titles-wrap">
  <div class="hero-gothic-title" id="t">DARK PLACE</div>
  <div class="hero-gothic-sub" id="s">TATTOO &amp; BARBERSHOP</div>
</div>
<script>
window.onload = () => {
  const t = document.getElementById('t');
  const s = document.getElementById('s');
  document.title = 'INFO: W=' + window.innerWidth + ' | T_w=' + Math.round(t.getBoundingClientRect().width) + ' | S_w=' + Math.round(s.getBoundingClientRect().width);
};
</script>
</body>
</html>
